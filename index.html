<!DOCTYPE html>
<html lang="ur" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Google AI Studio - Android APK Builder & Cloud CI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #030712;
      color: #F3F4F6;
      touch-action: manipulation;
    }
    .code-editor {
      font-family: 'JetBrains Mono', monospace;
      tab-size: 2;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #090D16;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #1F2937;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #374151;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-950 text-gray-100 flex flex-col justify-between">
  <div class="max-w-4xl mx-auto p-6 text-center">
    <h1 class="text-3xl font-extrabold text-sky-400 mb-2">Google AI Studio Assistant</h1>
    <p class="text-gray-400">Android APK Builder & Cloud CI Integration</p>
  </div>
</body>
</html>
